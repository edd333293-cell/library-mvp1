<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека Чехова · MVP-1</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Библиотека</h1>
    <p>Коллекция произведений</p>
  </header>

  <main>
    <!-- Секция: библиотека, список книг -->
    <section id="library">
      <h2>Список книг</h2>
      <div class="book-list">
        <!-- Карточки книг генерируются JavaScript -->
      </div>
    </section>

    <!-- Секция: читалка -->
    <section id="reader" class="hidden">
      <div class="reader-toolbar">
        <button id="back-to-library" type="button">← Назад к списку книг</button>
        <button id="admin-open" class="hidden" type="button">Админ</button>
      </div>

      <h2 id="reader-title">Заголовок книги</h2>
      <div id="reader-content"></div>
    </section>

    <!-- Секция: админка библиотеки -->
    <section id="admin" class="hidden">
      <button id="back-from-admin" type="button">← Назад к книге</button>

      <h2>Админка</h2>
      <p>Здесь будет загрузка и проверка текстов произведений.</p>

      <div id="admin-form">
        <label for="admin-title">Название</label>
        <input type="text" id="admin-title">

        <label for="admin-description">Краткое описание</label>
        <textarea id="admin-description"></textarea>

        <label for="admin-text">Полный текст произведения</label>
        <textarea id="admin-text" rows="10"></textarea>

        <button id="admin-preview" type="button">Предпросмотр</button>
        <!--добавили кнопки в админку-->
        <button id="admin-save-update" type="button">Перезаписать текущую книгу</button>
        <button id="admin-save-new" type="button">Создать новую книгу</button>
      </div>

      <div id="admin-preview-block" class="hidden">
        <h3>Предпросмотр</h3>
        <div id="admin-preview-content"></div>
      </div>

    </section>
  </main>

  <footer>
    <p>MVP-1 · День 17</p>
  </footer>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Основная логика приложения -->
  <script src="./script.js"></script>
</body>
</html>
