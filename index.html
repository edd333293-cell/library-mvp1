<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="adm.css"><!-- подключили js админки-->
</head>

<body>
  <!--добавили progress bar-->
  <div id="top-progress" class="top-progress hidden" aria-hidden="true">
    <div id="top-progress-bar" class="top-progress__bar"></div>
  </div>
  
  <header>
    <h1>Библиотека</h1>
    <p>Коллекция произведений А.П. Чехова</p>
  </header>

  <main>
    <!-- Секция: библиотека, главный экран -->
    <section id="library">
      <section class="section-row">
        <h2>Рекомендовано</h2>
        <div class="book-row" id="row-recommended"></div>
      </section>

      <section class="section-row">
        <h2>Все произведения</h2>
        <div class="book-row" id="row-all"></div>
      </section>
    </section>

    <!-- Секция: читалка -->
    <section id="reader" class="hidden">
      <div class="reader-toolbar">
        <button id="back-to-library" class="reader-back reader-back--peek" type="button">← К книгам</button>
        <button id="admin-open" class="reader-admin-petal hidden" type="button" aria-label="Админ">⚙</button>
      </div>

      <h2 id="reader-title">Заголовок книги</h2>
      <div id="reader-content"></div>
    </section>

    <!-- Секция: админка библиотеки -->
    <section id="admin" class="hidden">
      <button id="back-from-admin" type="button">← Назад к книге</button>

      <h2>Админка</h2>
      <p>Здесь будет загрузка и проверка текстов произведений.</p>

      <div id="admin-form">
        <label for="admin-title">Название</label>
        <input type="text" id="admin-title">

        <label for="admin-year">Год написания</label>
        <input type="number" id="admin-year" min="1800" max="2100">

        <label for="admin-description">Краткое описание</label>
        <textarea id="admin-description"></textarea>

        <label for="admin-fulltext">Полный текст произведения</label>
        <textarea id="admin-fulltext" rows="10"></textarea>

        <button id="admin-preview" type="button">Предпросмотр</button>
        <button id="admin-save-update" type="button">Перезаписать текущую книгу</button>
        <button id="admin-save-new" type="button">Создать новую книгу</button>
      </div>

      <div id="admin-preview-block" class="hidden">
        <h3>Предпросмотр</h3>
        <div id="admin-preview-content"></div>
      </div>

      <div id="admin-export-block">
        <h3>Экспорт каталога и текущей книги</h3>

        <button id="admin-export-books" type="button">Сформировать JSON каталога и книги</button>

        <label for="admin-catalog-json">JSON каталога</label>
        <textarea id="admin-catalog-json" rows="10"></textarea>

        <label for="admin-book-json">JSON текущей книги</label>
        <textarea id="admin-book-json" rows="14"></textarea>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <p class="footer-title">Библиотека Чехова · 2026</p>
  
      <div class="footer-links">
        <a
          class="footer-link"
          href="https://t.me/tg_chekhov"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Telegram-канал"
        >
          <span class="footer-link__icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" class="footer-svg" aria-hidden="true">
              <path d="M29.919 6.163l-4.225 19.925c-.319 1.406-1.15 1.756-2.331 1.094l-6.438-4.744-3.106 2.988c-.344.344-.631.631-1.294.631l.463-6.556 11.931-10.781c.519-.462-.113-.719-.806-.256l-14.75 9.288-6.35-1.988c-1.381-.431-1.406-1.381.288-2.044l24.837-9.569c1.15-.431 2.156.256 1.781 2.013z"/>
            </svg>
          </span>
          <span class="footer-link__text">Telegram</span>
        </a>
  
        <a
          class="footer-link"
          href="https://max.ru/tg_chekhov"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Канал в MAX"
        >
          <span class="footer-link__icon" aria-hidden="true">
            <svg viewBox="0 0 720 720" class="footer-svg" aria-hidden="true">
              <path d="M350.4 9.6C141.8 20.5 4.1 184.1 12.8 390.4c3.8 90.3 40.1 168 48.7 253.7 2.2 22.2-4.2 49.6 21.4 59.3 31.5 11.9 79.8-8.1 106.2-26.4 9-6.1 17.6-13.2 24.2-22 27.3 18.1 53.2 35.6 85.7 43.4 143.1 34.3 299.9-44.2 369.6-170.3C799.6 291.2 622.5-4.6 350.4 9.6zm-81 494.4c-11.3 8.8-22.2 20.8-34.7 27.7-18.1 9.7-23.7-.4-30.5-16.4-21.4-50.9-24-137.6-11.5-190.9 16.8-72.5 72.9-136.3 150-143.1 78-6.9 150.4 32.7 183.1 104.2 72.4 159.1-112.9 316.2-256.4 218.6z"/>
            </svg>
          </span>
          <span class="footer-link__text">MAX</span>
        </a>
      </div>
    </div>
  </footer>

<!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ядро клиентской логики -->
  <script src="./script.js"></script>

  <!-- Отдельный админский контур -->
  <script src="./adm.js"></script>

  <!-- Telegram-платформенный слой -->
  <script src="./telegram-platform.js"></script>

  <!-- Точка входа и запуск приложения -->
  <script src="./app.js"></script>
</body>
</html>
