<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Библиотека Чехова · MVP-1</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="adm.css"><!-- подключили js админки-->
</head>

<body>
  <!--добавили progress bar-->
  <div id="top-progress" class="top-progress hidden" aria-hidden="true">
    <div id="top-progress-bar" class="top-progress__bar"></div>
  </div>
  
  <header>
    <h1>Библиотека</h1>
    <p>Коллекция произведений А.П. Чехова</p>
  </header>

  <main>
    <!-- Секция: библиотека, главный экран -->
    <section id="library">
      <section class="section-row">
        <h2>Рекомендовано</h2>
        <div class="book-row" id="row-recommended"></div>
      </section>

      <section class="section-row">
        <h2>Все произведения</h2>
        <div class="book-row" id="row-all"></div>
      </section>
    </section>

    <!-- Секция: читалка -->
    <section id="reader" class="hidden">
      <div class="reader-toolbar">
        <button id="back-to-library" class="reader-back reader-back--peek" type="button">← К книгам</button>
        <button id="admin-open" class="reader-admin-petal hidden" type="button" aria-label="Админ">⚙</button>
      </div>

      <h2 id="reader-title">Заголовок книги</h2>
      <div id="reader-content"></div>
    </section>

    <!-- Секция: админка библиотеки -->
    <section id="admin" class="hidden">
      <button id="back-from-admin" type="button">← Назад к книге</button>

      <h2>Админка</h2>
      <p>Здесь будет загрузка и проверка текстов произведений.</p>

      <div id="admin-form">
        <label for="admin-title">Название</label>
        <input type="text" id="admin-title">

        <label for="admin-year">Год написания</label>
        <input type="number" id="admin-year" min="1800" max="2100">

        <label for="admin-description">Краткое описание</label>
        <textarea id="admin-description"></textarea>

        <label for="admin-fulltext">Полный текст произведения</label>
        <textarea id="admin-fulltext" rows="10"></textarea>

        <button id="admin-preview" type="button">Предпросмотр</button>
        <button id="admin-save-update" type="button">Перезаписать текущую книгу</button>
        <button id="admin-save-new" type="button">Создать новую книгу</button>
      </div>

      <div id="admin-preview-block" class="hidden">
        <h3>Предпросмотр</h3>
        <div id="admin-preview-content"></div>
      </div>

      <div id="admin-export-block">
        <h3>Экспорт библиотеки (books.json)</h3>
        <button id="admin-export-books" type="button">Скопировать JSON библиотеки</button>
        <textarea id="admin-books-json" rows="12"></textarea>
      </div>
    </section>
  </main>

  <footer>
    <p>MVP-1 · День 22 (выделение telegram-platform.js)</p>
  </footer>

<!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Ядро клиентской логики -->
  <script src="./script.js"></script>

  <!-- Отдельный админский контур -->
  <script src="./adm.js"></script>

  <!-- Telegram-платформенный слой -->
  <script src="./telegram-platform.js"></script>

  <!-- Точка входа и запуск приложения -->
  <script src="./app.js"></script>
</body>
</html>
